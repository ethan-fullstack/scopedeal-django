{% if page_obj.has_other_pages %}<nav class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 px-5 py-4 text-sm" aria-label="Paginación"><p class="text-slate-500">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} registros</p><div class="flex gap-2">{% if page_obj.has_previous %}<a class="btn-secondary" href="?{{ query_params }}&amp;page={{ page_obj.previous_page_number }}">← Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="btn-secondary" href="?{{ query_params }}&amp;page={{ page_obj.next_page_number }}">Siguiente →</a>{% endif %}</div></nav>{% endif %}
