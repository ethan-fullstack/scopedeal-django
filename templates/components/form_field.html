<div class="field {% if field.errors %}field-invalid{% endif %}">{% if field.field.widget.input_type == 'checkbox' %}<div class="flex min-h-11 items-center gap-3">{{ field }}{{ field.label_tag }}</div>{% else %}{{ field.label_tag }}{{ field }}{% endif %}{% if field.help_text %}<div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}{% if field.errors %}<div role="alert">{{ field.errors }}</div>{% endif %}</div>
