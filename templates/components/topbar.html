<header class="sticky top-0 z-30 flex min-h-20 items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 sm:px-6 lg:px-8"><div class="flex min-w-0 items-center gap-3"><button type="button" id="navigation-toggle" aria-label="Abrir menú" aria-controls="app-sidebar" aria-expanded="false" class="inline-flex size-11 shrink-0 items-center justify-center rounded-lg border border-slate-200 lg:hidden">{% include 'components/icon.html' with name='menu' %}</button><a class="lg:hidden" href="/dashboard/" aria-label="ScopeDeal, dashboard">{% include 'components/brand.html' %}</a><form action="{% url 'proposals' %}" method="get" role="search" class="hidden items-center gap-2 rounded-lg bg-slate-50 px-3 md:flex"><label class="sr-only" for="global-search">Buscar propuestas o clientes</label><input id="global-search" name="q" type="search" placeholder="Buscar propuestas, clientes…" value="{{ request.GET.q }}" maxlength="180" class="min-h-11 w-40 bg-transparent text-sm lg:w-56 xl:w-72"><button class="inline-flex min-h-11 w-8 shrink-0 items-center justify-center rounded-md text-slate-500 hover:bg-slate-100" type="submit" aria-label="Buscar propuestas">{% include 'components/icon.html' with name='search' %}</button></form></div><details class="relative"><summary class="flex min-h-11 list-none items-center gap-3 rounded-lg p-1 hover:bg-slate-50"><span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-bold text-blue-800">{{ user.username|first|upper }}</span><span class="hidden text-left sm:block"><span class="block max-w-40 truncate text-sm font-semibold text-navy">{{ user.get_full_name|default:user.username }}</span><span class="block text-xs text-slate-500">{{ user.get_role_display }}</span></span><span class="text-xs text-slate-400" aria-hidden="true">▾</span><span class="sr-only">Abrir opciones de usuario</span></summary><div class="absolute right-0 mt-3 w-56 rounded-xl border border-slate-200 bg-white p-3 shadow-lg"><p class="break-words px-2 py-2 text-sm text-slate-600">{{ user.username }} · {{ user.get_role_display }}</p>{% if user.role == 'CLIENT' %}<a class="link px-2" href="/clients/me/">Mi organización</a>{% endif %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn-secondary w-full">Salir</button></form></div></details></header>
