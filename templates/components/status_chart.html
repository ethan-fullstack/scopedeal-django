<section class="card card-body"><h2 class="mb-6 font-bold">Estado de propuestas</h2><div class="flex flex-wrap items-center justify-center gap-8"><div class="relative size-40 shrink-0 rounded-full" style="background:conic-gradient({{ status_chart.gradient }})" role="img" aria-label="{{ status_chart.count }} propuestas; distribución detallada en la leyenda"><div class="absolute inset-5 flex flex-col items-center justify-center rounded-full bg-white"><strong class="text-3xl font-bold text-navy">{{ status_chart.count }}</strong><span class="text-xs text-slate-500">propuestas</span></div></div><ul class="min-w-40 flex-1 space-y-3 text-xs">{% for row in status_chart.legend %}<li class="flex items-center justify-between gap-4"><span class="flex items-center gap-2"><span class="size-2.5 rounded-full" style="background-color:{{ row.color }}" aria-hidden="true"></span>{{ row.label }}</span><strong>{{ row.count }}</strong></li>{% endfor %}</ul></div>{% if not status_chart.count %}<p class="mt-5 text-xs text-slate-500">Aún no hay propuestas para comparar.</p>{% endif %}</section>
