{% if form.errors %}<div class="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert"><h2 class="mb-2 font-semibold text-red-800">Revise los datos antes de continuar</h2>{{ form.non_field_errors }}{% for field in form %}{% if field.errors %}<p><a class="underline" href="#{{ field.id_for_label }}">{{ field.label }}</a>: {{ field.errors|striptags }}</p>{% endif %}{% endfor %}</div>{% endif %}
