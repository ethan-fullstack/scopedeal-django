{% if user.role == 'DEVELOPER' %}{% if draft %}<a class="btn-secondary" href="/proposals/{{ object.pk }}/edit/">Editar propuesta</a><form method="post" action="/proposals/{{ object.pk }}/submit/">{% csrf_token %}<button class="btn" name="review" value="yes">Enviar propuesta</button></form>{% endif %}{% if can_clone %}<form method="post" action="/proposals/{{ object.pk }}/clone/">{% csrf_token %}<button class="btn-secondary" name="review" value="yes">Crear nueva versión</button></form>{% endif %}{% elif eligible %}<form method="post" action="/proposals/{{ object.pk }}/accept/">{% csrf_token %}<button class="btn bg-emerald-600 hover:bg-emerald-700">Revisar aceptación</button></form><form method="post" action="/proposals/{{ object.pk }}/reject/">{% csrf_token %}<button class="btn-danger">Revisar rechazo</button></form>{% endif %}
