services:
  database:
    image: postgres:17
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["0.0.0.0:5432:5432"]
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.lan
    ports: ["0.0.0.0:8000:8000"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
