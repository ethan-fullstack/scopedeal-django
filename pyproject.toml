[project]
name = "scopedeal-django"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2.18,<5.3",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "gunicorn>=23",
    "whitenoise>=6.9",
    "httpx>=0.28",
    "python-dotenv>=1.2.4",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.10", "pytest-cov>=6", "ruff>=0.11"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/browser_smoke.py" = ["E402"]  # Django setup must precede model imports in this standalone runner.
